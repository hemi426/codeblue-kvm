# Builds and tests everything on every push, so "works on my machine" gets
# caught here rather than by someone else.
name: CI

# Pushes and pull requests that only touch documentation (or issue templates)
# don't need a build; anything that also changes code still runs everything.
# Branches only: version tags run the release workflow instead.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "assets/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Framing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: C framing test (firmware/main/frame.c)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/main \
              firmware/test/test_frame.c firmware/main/frame.c -o "$RUNNER_TEMP/test_frame"
          "$RUNNER_TEMP/test_frame"

      - name: Python framing self-test (tools/cb_test.py)
        run: python3 tools/cb_test.py selftest

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [devkitc-v1.0, devkitc-v1.1]
    steps:
      - uses: actions/checkout@v6

      # The ESP-IDF Docker image plus the build need more room than a stock
      # runner has spare, so drop preinstalled toolchains we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # CI builds with the same ESP-IDF release the bootstrap scripts install.
      - name: Read the tested ESP-IDF version
        id: idf
        run: echo "version=$(tr -d '[:space:]' < firmware/IDF_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build with ESP-IDF ${{ steps.idf.outputs.version }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32s3
          path: firmware
          # merge-bin also writes build/merged-binary.bin: bootloader,
          # partition table and app in one image that flashes at 0x0.
          command: idf.py -DBOARD=${{ matrix.board }} build merge-bin

      - name: Keep the binaries
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/build/merged-binary.bin
            firmware/build/codeblue.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
          if-no-files-found: error

  viewer:
    name: Viewer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build viewer/CodeBlue.Viewer -c Release
