# Builds the docs site from docs/ (Jekyll, Just the Docs) whenever the docs
# change or a release is published, and deploys it to GitHub Pages once the
# repository is public (Pages on a private repository needs a paid plan).
#
# The site includes the browser installer (docs/firmware.md): each build
# copies the latest firmware release's images into docs/install/ and writes
# an ESP Web Tools manifest (codeblue.json) next to them. Browsers can't
# flash files fetched from GitHub's release downloads (another site), so the
# images have to be served by the site itself.
#
# Until the repository is public, every run keeps the built site as an
# artifact named "github-pages". To preview it: download it, unzip it,
# extract artifact.tar into a folder named codeblue-kvm, run
# `python -m http.server` in that folder's parent, and open
# http://localhost:8000/codeblue-kvm/. (The installer needs the real site:
# Web Serial works only over HTTPS or on localhost, and the preview is on
# localhost, so it should work there too.)
#
# After making the repository public: Settings > Pages > Source: GitHub
# Actions (once). From then on, each push to main that touches the docs, and
# each published firmware release, publishes the site. A release run deploys
# from its tag, so the github-pages environment must allow firmware-v* tags
# (Settings > Environments > github-pages > Deployment branches and tags).
name: Docs site

on:
  push:
    branches: [main]
    paths: ["docs/**", "assets/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "assets/**", ".github/workflows/docs.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue up rather than cancel each other halfway; pull requests
# get their own groups.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'docs-pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Only firmware releases change the site (the installer serves the latest
    # firmware); viewer releases have nothing to add.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'firmware-v')
    runs-on: ubuntu-latest
    steps:
      # A release event checks out the release's tag by default, which may
      # be behind main; the site always comes from main.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      # One copy of the logo lives in assets/; the site gets it at build time.
      - name: Copy the logo
        run: cp assets/codeblue.svg docs/images/codeblue.svg

      - name: Add the latest firmware for the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
                   --exclude-pre-releases --limit 100 --json tagName,publishedAt \
                   --jq '[.[] | select(.tagName | startswith("firmware-v"))]
                         | sort_by(.publishedAt) | last | .tagName // empty')"
          if [ -z "$tag" ]; then
            echo "::warning::No published firmware release; the install button won't work."
            exit 0
          fi
          v="${tag#firmware-v}"
          mkdir -p docs/install
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'codeblue-firmware-*.bin' --dir docs/install
          # Since 0.4.0, releases include the bootloader, partition table, and
          # app as separate images. Writing those three leaves the board
          # settings (NVS, between the partition table and the app) alone
          # unless the user chooses to erase. Earlier releases have only the
          # merged image, written from 0, which overwrites them.
          p="codeblue-firmware-$v"
          if [ -f "docs/install/$p-app.bin" ]; then
            for part in bootloader partition-table; do
              if [ ! -f "docs/install/$p-$part.bin" ]; then
                echo "::error::$tag has an app image but no $part image."
                exit 1
              fi
            done
            parts="{ \"path\": \"$p-bootloader.bin\", \"offset\": 0 },
                     { \"path\": \"$p-partition-table.bin\", \"offset\": 32768 },
                     { \"path\": \"$p-app.bin\", \"offset\": 65536 }"
            keeps="keeps the board settings"
          elif [ -f "docs/install/$p.bin" ]; then
            parts="{ \"path\": \"$p.bin\", \"offset\": 0 }"
            keeps="resets the board settings (merged image)"
          else
            echo "::error::$tag has no firmware image the installer can use."
            exit 1
          fi
          # improv_wait_time 0: CodeBlue doesn't speak Improv (Wi-Fi setup),
          # so don't wait for it after flashing.
          cat > docs/install/codeblue.json <<JSON
          {
            "name": "CodeBlue firmware",
            "version": "$v",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 0,
            "builds": [
              { "chipFamily": "ESP32-S3", "parts": [ $parts ] }
            ]
          }
          JSON
          jq . docs/install/codeblue.json
          # The Firmware page shows the version on its install button.
          mkdir -p docs/_data
          printf 'version: "%s"\n' "$v" > docs/_data/firmware.yml
          ls -l docs/install
          echo "Installer serves firmware $v; updating $keeps." >> "$GITHUB_STEP_SUMMARY"

      - name: Build the site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    name: Deploy
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'release') &&
      !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4